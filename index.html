<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명조 매트릭스 파티 빌더</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark.css" media="(prefers-color-scheme: dark)">
    <script src="js/circuits.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="wrap">
        <div class="char_list_wrap">
            <div class="filter_box">
                <ul class="main_filter" id="mainFilter">
                    <li class="active" data-filter="all">ALL</li>
                    <li class="el glacio" data-filter="glacio"></li>    <!-- 응결 -->
                    <li class="el fusion" data-filter="fusion"></li>    <!-- 용융 -->
                    <li class="el electro" data-filter="electro"></li>  <!-- 전도 -->
                    <li class="el aero" data-filter="aero"></li>        <!-- 기류 -->
                    <li class="el spectro" data-filter="spectro"></li>  <!-- 회절 -->
                    <li class="el havoc" data-filter="havoc"></li>      <!-- 인멸 -->
                </ul>

                <ul class="option_btn">
                    <li class="char_owned" id="ownedFilterBtn">보유만</li>
                    <li id="ownedPopupBtn">보유설정</li>
                </ul>
            </div>

            <ul class="char_list" id="characterList">
                <!-- JS로 캐릭터 생성 -->
            </ul>
        </div>

        <div class="party_list">
            <div class="list_tit">
                <h3>파티구성<span class="guide_txt">캐릭터는 슬롯으로 · ☰ 핸들은 파티 순서 이동</span></h3>
                <div class="party_toolbar">
                <button type="button" class="party_btn" id="resetPartyBtn">초기화</button>
                <button type="button" class="party_btn" id="saveBtn">메모장 저장</button>
                <button type="button" class="party_btn" id="addPartyBtn">파티 추가</button>
                </div>
            </div>

            <div class="party_area" id="partyArea"></div>
        </div>
    </div>

    <div class="layer_dim" id="layerDim"></div>

    <div class="layer_popup" id="ownedPopup">
        <div class="popup_header">
            <h3>캐릭 보유여부</h3>
            <ul class="main_filter" id="">
                    <li class="active" data-filter="all">ALL</li>
                    <li class="el glacio" data-filter="glacio"></li>    <!-- 응결 -->
                    <li class="el fusion" data-filter="fusion"></li>    <!-- 용융 -->
                    <li class="el electro" data-filter="electro"></li>  <!-- 전도 -->
                    <li class="el aero" data-filter="aero"></li>        <!-- 기류 -->
                    <li class="el spectro" data-filter="spectro"></li>  <!-- 회절 -->
                    <li class="el havoc" data-filter="havoc"></li>      <!-- 인멸 -->
                </ul>
        </div>
        <div class="own_list_div">
            <ul class="own_list" id="ownList">
                <!-- characters 에 따른 리스트 생성(스크립트) -->
            </ul>
        </div>
        <ul class="popup_btn">
            <li class="ok" id="ownedOkBtn">확인</li><li class="cancel" id="ownedCancelBtn">취소</li>
        </ul>
    </div>
    <dialog id="circuitDialog" class="circuit_dialog" aria-labelledby="circuitTitle">
        <div class="circuit_header"><h3 id="circuitTitle">회로 버프 선택</h3><button type="button" id="closeCircuitBtn" aria-label="닫기">×</button></div>
        <p id="circuitHelp" class="circuit_help"></p>
        <div id="circuitContent"></div>
        <div class="circuit_footer" id="circuitFooter"></div>
    </dialog>
</body>
</html>
